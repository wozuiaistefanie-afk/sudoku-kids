<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数独乐园 🎈</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 背景小装饰 -->
<div class="bg-decor" aria-hidden="true">
  <span class="floaty f1">🎈</span>
  <span class="floaty f2">⭐</span>
  <span class="floaty f3">🌈</span>
  <span class="floaty f4">🦄</span>
  <span class="floaty f5">🎀</span>
  <span class="floaty f6">☁️</span>
</div>

<!-- ======== 主页 ======== -->
<section id="home-screen" class="screen active">
  <div class="home-wrap">
    <header class="hero">
      <h1 class="title">数独乐园</h1>
      <p class="subtitle">边玩边学，越来越聪明！</p>
    </header>

    <div class="mascot-box">
      <div class="mascot">🦊</div>
      <div class="mascot-bubble" id="home-msg">嗨！选一个喜欢的主题，一起玩数独吧！</div>
    </div>

    <div class="panel">
      <h2 class="panel-title">🎨 选择主题</h2>
      <div class="options theme-options" id="theme-options"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">📐 选择格子</h2>
      <div class="options size-options" id="size-options"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">😊 选择难度</h2>
      <div class="options diff-options" id="diff-options"></div>
    </div>

    <button class="btn-start" id="btn-start">🚀 开始游戏</button>

    <div class="stats" id="home-stats"></div>
  </div>
</section>

<!-- ======== 游戏页 ======== -->
<section id="game-screen" class="screen">
  <div class="game-wrap">
    <header class="game-top">
      <button class="icon-btn" id="btn-home" title="返回主页">🏠</button>
      <div class="game-title">数独乐园</div>
      <button class="icon-btn" id="btn-sound" title="声音">🔊</button>
    </header>

    <div class="game-info">
      <div class="info-chip" id="timer-chip">🕐 00:00</div>
      <div class="info-chip" id="hint-chip" title="点一下用提示">💡 提示 ×3</div>
      <div class="info-chip" id="level-chip">4×4 · 简单</div>
    </div>

    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>

    <div class="pad" id="pad"></div>

    <div class="mascot-box game-mascot">
      <div class="mascot small">🦊</div>
      <div class="mascot-bubble" id="game-msg">点一个空格，再点下面的图案填进去吧！</div>
    </div>
  </div>
</section>

<!-- ======== 胜利弹窗 ======== -->
<div id="win-overlay" class="overlay hidden">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <h2>太棒啦！</h2>
    <div class="stars" id="win-stars"></div>
    <p id="win-time"></p>
    <div class="win-buttons">
      <button class="btn-win" id="btn-replay">🔁 再玩一次</button>
      <button class="btn-win ghost" id="btn-win-home">🏠 回主页</button>
    </div>
  </div>
</div>

<script src="js/sudoku.js"></script>
<script src="js/audio.js"></script>
<script src="js/confetti.js"></script>
<script src="js/app.js"></script>
</body>
</html>
